# Integração contínua do S3: a cada push e pull request, roda a suíte de
# testes com cobertura e constrói a imagem Docker do servidor.
# Roda nos servidores do GitHub: não usa o broker Kafka do projeto
# (nenhum teste acessa broker) nem os créditos de nuvem do professor.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (pytest + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependências
        run: pip install -r requirements-dev.txt coverage

      - name: Suíte do S3
        env:
          PYTHONPATH: src
        run: python -m coverage run --source=src/s3 -m pytest tests/s3 -q

      - name: Cobertura
        run: |
          python -m coverage report
          {
            echo "## Cobertura do S3"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  imagem:
    name: Imagem Docker do servidor
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t ods-s3:ci .

      - name: Conferir que a imagem abre o S3
        run: docker run --rm ods-s3:ci --help

  # Só na main: publica a imagem pronta, para ARM (Jetson) e PC, no GitHub
  # Container Registry. A equipe de implantação baixa e roda, sem construir:
  #   docker pull ghcr.io/ods-26-2/s3:latest
  publicar:
    name: Publicar a imagem (ghcr.io, arm64 e amd64)
    runs-on: ubuntu-latest
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ods-26-2/s3:latest
            ghcr.io/ods-26-2/s3:${{ github.sha }}
          # Liga o pacote ao repositório (mesmas permissões de acesso).
          labels: |
            org.opencontainers.image.source=https://github.com/ods-26-2/s3
            org.opencontainers.image.description=S3 - Alertas e Notificações (VER-3)
