# S3 rodando NA Jetson (para a equipe de implantação).
#
#   docker compose -f infra/jetson/docker-compose.yml up -d --build
#   docker compose -f infra/jetson/docker-compose.yml logs -f s3
#   docker exec ods-s3 python tools/verificar_broker.py --broker-oficial
#
# Desde 11/11/2026, o Kafka da Jetson anuncia kafka:9092: o nome do contêiner
# do Kafka na rede Docker dele. Só quem está nessa mesma rede resolve o nome,
# então o S3 entra na rede do Kafka e usa kafka:9092.
#
# Nome da rede: veja com `docker network ls` na Jetson. O padrão aqui é
# kafka_default (o que o Docker cria para um compose na pasta "kafka"); se
# for outro, ponha no infra/jetson/.env:   KAFKA_REDE=<nome da rede>
#
# Antes de subir: desligue o S3 que estiver rodando pelo notebook
# (ligar_ponte_jetson.ps1 -Parar). Dois S3 no mesmo Kafka respondem aos
# mesmos comandos, cada um com o seu banco.
services:
  s3:
    build:
      context: ../..
    image: ods-s3
    container_name: ods-s3
    restart: unless-stopped
    environment:
      S3_KAFKA_BOOTSTRAP: ${S3_KAFKA_BOOTSTRAP:-kafka:9092}
      S3_KAFKA_GROUP_ID: ${S3_KAFKA_GROUP_ID:-S3-alertas}
      # Quem pode mandar comandos ao S3 (o broker não tem autenticação).
      # Vazio = qualquer produtor. Ex.: S3_PRODUTORES_COMANDOS=A3,A5,A7
      S3_PRODUTORES_COMANDOS: ${S3_PRODUTORES_COMANDOS:-}
    volumes:
      - s3-dados:/dados
    networks:
      - kafka
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kafka:
    external: true
    name: ${KAFKA_REDE:-kafka_default}

volumes:
  s3-dados:
