# S3 no servidor, ligado ao broker do projeto.
#
#   S3_KAFKA_BOOTSTRAP=172.18.4.56:9092 docker compose -f infra/servidor/docker-compose.yml up -d --build
#   (o infra/servidor/instalar.sh faz isso e guarda o broker no .env)
#   docker compose -f infra/servidor/docker-compose.yml logs -f s3     # uma linha por mensagem
#   docker compose -f infra/servidor/docker-compose.yml down           # para (o volume fica)
#
# Sem .env nem variável, usa o Kafka da Jetson (172.18.4.56:9092, só na rede
# do DComp), como pediu o professor. O broker é compartilhado pelos squads.
services:
  s3:
    build:
      context: ../..
    image: ods-s3
    container_name: ods-s3
    restart: unless-stopped
    environment:
      S3_KAFKA_BOOTSTRAP: ${S3_KAFKA_BOOTSTRAP:-172.18.4.56:9092}
      S3_KAFKA_GROUP_ID: ${S3_KAFKA_GROUP_ID:-S3-alertas}
      # Quem pode mandar comandos ao S3 (o broker não tem autenticação).
      # Vazio = qualquer produtor. Para ligar, ponha no infra/servidor/.env:
      #   S3_PRODUTORES_COMANDOS=A3,A5,A7
      S3_PRODUTORES_COMANDOS: ${S3_PRODUTORES_COMANDOS:-}
    volumes:
      - s3-dados:/dados
      # Para outra configuração, descomente e aponte para os arquivos da aplicação:
      # - ./config/routing.json:/config/routing.json:ro
      # - ./config/permissoes.json:/config/permissoes.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  s3-dados:

# Rede fixa fora de 172.16–31.x: a rede do DComp e o Kafka da Jetson estão em
# 172.18.x.x, e uma rede Docker nessa faixa desviaria o tráfego para o broker
# (aconteceu em 06/11/2026). Vale no próximo `up`.
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.2.0/24
